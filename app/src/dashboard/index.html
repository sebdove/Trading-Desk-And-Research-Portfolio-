<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PVSRA Bot Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap">
<script src="/lw.js"></script>
<style>
/* Same tokens as the PVSRA Vector Desk, Simple view */
:root{
  --bg:#0c1016; --panel:#121820; --panel-2:#18202a; --line:#232c38; --fg:#d6dce4; --muted:#7f8b9b;
  --accent:#d9a441; --accent-ink:#1b1405; --grid:rgba(127,139,155,.09); --cross:#7f8b9b;
  --up:#26b37a; --down:#e0474f;
  --c-up:#00e65c; --c-dn:#ff2d3d; --r-up:#3d7bff; --r-dn:#ff3dff; --n-up:#9aa3ae; --n-dn:#545c68;
  --sans:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace; color-scheme:dark }
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f3f5f8; --panel:#ffffff; --panel-2:#edf0f4; --line:#d8dee6; --fg:#17202b; --muted:#5c6878;
  --accent:#a8771a; --accent-ink:#fff8ea; --grid:rgba(92,104,120,.10); --cross:#5c6878; --up:#13945f; --down:#cc2f38;
  --c-up:#00a83a; --c-dn:#e0162b; --r-up:#1f4fff; --r-dn:#c800c8; --n-up:#adb4bd; --n-dn:#4f5763; color-scheme:light }}
html,body{height:100%}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;background:var(--panel);border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:700;letter-spacing:.02em;font-size:15px;white-space:nowrap}
.brand b{color:var(--accent)}.brand small{font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.seg{display:flex;gap:2px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:2px;max-width:100%;overflow-x:auto;scrollbar-width:thin}
.seg button{border:0;background:none;padding:5px 10px;border-radius:4px;cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.seg button:hover{color:var(--fg)}.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg .tag{font-size:9.5px;letter-spacing:.06em;opacity:.75}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}.dot.open{background:var(--c-up)}
.sp{flex:1}.chip{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;color:var(--muted)}
.chip.live{color:var(--c-dn);border-color:color-mix(in srgb,var(--c-dn) 50%,transparent)}.chip.paper{color:var(--r-up);border-color:color-mix(in srgb,var(--r-up) 50%,transparent)}
.body{flex:1;display:flex;min-height:0}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
aside{width:340px;flex:none;border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:14px 16px 28px}
aside h2{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;font-weight:600}aside h2:first-child{margin-top:0}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.hist{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px;vertical-align:1px}.hsnote{font-size:12px;margin:10px 0 0}
.sigtg{float:right;font:inherit;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:none;border:1px solid var(--line);border-radius:4px;padding:2px 6px;cursor:pointer}.sigtg:hover{color:var(--fg)}.sigkv{margin-bottom:6px}
/* model view */
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:14px 16px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.card .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card .v{font-family:var(--mono);font-size:22px;font-weight:500;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{font-family:var(--mono);font-size:12px;color:var(--muted)}
.pos{color:var(--up)}.neg{color:var(--down)}
.eqwrap{flex:1;min-height:240px;margin:12px 16px 16px;border:1px solid var(--line);border-radius:8px;background:var(--panel);position:relative}
.eqwrap .ttl{position:absolute;top:8px;left:12px;z-index:2;font-size:12px;color:var(--muted);font-family:var(--mono)}
#eq{position:absolute;inset:28px 0 0 0}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 10px;margin:0 -10px;border-radius:6px;cursor:pointer;font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.row:hover{background:var(--panel-2)}.row .r{text-align:right}.row .m{color:var(--muted);font-size:11.5px}
.sigcard{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel-2);margin-bottom:8px}
.sigcard .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.sigcard .side{font-family:var(--mono);font-weight:600;font-size:13px;letter-spacing:.04em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px}.kv span:nth-child(odd){color:var(--muted)}.kv span:nth-child(even){font-family:var(--mono);text-align:right}
.rule{font-size:12.5px;color:var(--muted);line-height:1.5;margin:8px 0 0}

.tl.tr{cursor:pointer}.tl{font-family:var(--mono);font-size:12px;display:grid;grid-template-columns:1fr auto;gap:1px 10px;padding:6px 0;border-top:1px solid var(--line)}.tl .w{grid-column:1/-1;color:var(--muted);font-size:11.5px}.tl:first-of-type{border-top:0}
.tl .m{color:var(--muted)}
/* asset view: chart in Simple view */
#wrap{position:absolute;inset:0}#tfs{position:absolute;left:8px;bottom:54px;z-index:4;display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:7px;background:var(--panel);box-shadow:0 2px 8px rgba(0,0,0,.25)}#tfs button{font-family:var(--mono);font-size:12px;padding:4px 8px;border:0;border-radius:5px;background:none;color:var(--muted);cursor:pointer;position:relative}#tfs button:hover:not(:disabled){color:var(--fg)}#tfs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}#tfs button:disabled{opacity:.35;cursor:not-allowed}#tfs button.bot::after{content:"";position:absolute;top:2px;right:2px;width:4px;height:4px;border-radius:50%;background:currentColor}#tfnote{position:absolute;left:8px;bottom:92px;z-index:4;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;max-width:60%}#centre{position:absolute;right:76px;bottom:54px;z-index:4;font-family:var(--mono);font-size:12px;font-weight:500;padding:5px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}#centre:hover{border-color:var(--accent);color:var(--accent)}#chart{position:absolute;inset:0}#back{position:absolute;inset:0;pointer-events:none;z-index:2}
.legend{position:absolute;z-index:3;top:8px;left:12px;pointer-events:none;font-family:var(--mono);font-size:12px;line-height:1.55;max-width:calc(100% - 330px)}
.legend .l1{font-family:var(--sans);font-size:13px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.legend .l1 b{font-family:var(--mono);font-size:14px}
.legend .m{color:var(--muted)}
.status{position:absolute;z-index:3;top:8px;right:84px;background:color-mix(in srgb,var(--bg) 92%,transparent);border-left:3px solid var(--muted);padding:5px 10px;font-family:var(--mono);font-size:11px;line-height:1.5;pointer-events:none}
.status .a{font-weight:600}
.cons .score{font-family:var(--mono);font-size:34px;line-height:1;font-weight:500}.cons .lab{font-weight:600;font-size:15px;margin-left:8px}
.gauge{position:relative;height:8px;border-radius:4px;margin:10px 0 4px;background:linear-gradient(90deg,var(--c-dn) 0 20%,var(--r-dn) 20% 35%,var(--n-dn) 35% 45%,var(--muted) 45% 55%,var(--n-up) 55% 65%,var(--r-up) 65% 80%,var(--c-up) 80% 100%)}
.gauge i{position:absolute;top:-4px;width:4px;height:16px;border-radius:2px;background:var(--fg);box-shadow:0 0 0 2px var(--panel)}
.votes{display:flex;gap:6px;margin-top:10px}
.cons .head{display:flex;align-items:baseline;gap:10px}.cons .since{font-size:12px;color:var(--muted);margin-top:2px}
.gauge-l{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-family:var(--mono)}
.ckey{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:11px;color:var(--muted);margin-top:8px}.ckey span{display:flex;align-items:center;gap:4px}.ckey i{width:8px;height:8px;border-radius:2px;display:block}
.mvotes{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-top:10px}
.mvote{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px 8px 0;border-top:1px solid var(--line);background:var(--panel-2)}
.mvote:first-child{border-top:0}.mvote>i{align-self:stretch;display:block}
.mvote .nm{font-weight:600;font-size:13px}.mvote .why{font-size:12px;color:var(--muted);line-height:1.35}
.mvote .vv{font-family:var(--mono);font-size:11.5px;font-weight:500;padding:2px 7px;border-radius:4px;white-space:nowrap}
.bspark{display:block;width:100%;height:34px;margin-top:6px}
.votes b{font-family:var(--mono);font-size:11px;font-weight:500;padding:3px 6px;border-radius:4px;border:1px solid var(--line)}
.notice{margin:auto;max-width:520px;text-align:center;color:var(--muted);padding:30px 20px;line-height:1.6}.notice code{font-family:var(--mono);color:var(--fg);background:var(--panel-2);padding:2px 6px;border-radius:4px}
[hidden]{display:none!important}
@media (max-width:860px){.body{flex-direction:column;overflow-y:auto}aside{width:auto;border-left:0;border-top:1px solid var(--line)}.main{min-height:440px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.legend{max-width:calc(100% - 24px)}.status{top:auto;bottom:34px;right:8px}}
</style></head>
<body>
<header class="bar">
  <div class="brand"><span><b>PVSRA</b> Vector Desk</span><small>Bot · simple view</small></div>
  <div class="seg" id="models" role="tablist" aria-label="Model"></div>
  <div class="seg" id="bubbleSeg" role="tablist" aria-label="Bubble Watch"></div>
  <div class="seg" id="assets" role="tablist" aria-label="Assets traded"></div>
  <span class="sp"></span>
  <div id="appCtl"></div>
  <span class="chip" id="upd">loading…</span>
</header>
<div class="body">
  <section class="main" id="modelMain">
    <div class="cards" id="cards"></div>
    <div class="eqwrap"><div class="ttl" id="eqTtl">Account value</div><div id="eq"></div></div>
  </section>
  <section class="main" id="assetMain" hidden>
    <div id="wrap"><div id="chart"></div><canvas id="back"></canvas><div id="tfs" role="group" aria-label="Chart timeframe"></div><div id="tfnote" hidden></div><button type="button" id="centre" title="Centre on the latest candles (shortcut: C)">⌖ Live</button></div>
    <div class="legend" id="legend"></div>
    <div class="status" id="status"></div>
  </section>
  <section class="main" id="bubbleMain" hidden><iframe id="bubbleFrame" title="S&amp;P 500 Bubble Watch" style="border:0;width:100%;height:100%;display:block;background:var(--bg)"></iframe></section>
  <aside id="side"></aside>
</div>
<script>
(function(){
const $=id=>document.getElementById(id), LW=window.LightweightCharts;
const cssv=k=>getComputedStyle(document.documentElement).getPropertyValue(k).trim();const C={};
const readColors=()=>['--fg','--muted','--grid','--line','--up','--down','--c-up','--c-dn','--r-up','--r-dn','--n-up','--n-dn','--accent','--accent-ink','--bg','--panel'].forEach(k=>C[k]=cssv(k));readColors();
const alpha=(hex,a)=>{hex=hex.replace('#','');if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');const n=parseInt(hex,16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`};
const CONS_LV=[[60,'Strong buy'],[30,'Buy'],[10,'Lean long'],[-10,'Neutral'],[-30,'Lean short'],[-60,'Sell'],[-101,'Strong sell']];
const consLabel=s=>{for(const[t,l]of CONS_LV)if(s>=t)return l;return'Strong sell'};
const consTok=v=>v>=60?'--c-up':v>=30?'--r-up':v>=10?'--n-up':v>-10?'--muted':v>-30?'--n-dn':v>-60?'--r-dn':'--c-dn';
const consCol=v=>C[consTok(v)];
const money=v=>v==null||!isFinite(v)?'–':(v<0?'−$':'$')+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const smoney=v=>(v>=0?'+':'')+money(v).replace('−','−');
const pct=v=>(v>=0?'+':'−')+Math.abs(v*100).toFixed(1)+'%';
const px=v=>v==null?'–':(+v).toLocaleString('en-US',{maximumSignificantDigits:6});
const when=t=>t?new Date(t*1000).toISOString().replace('T',' ').slice(0,16)+' UTC':'–';
const day=t=>new Date(t*1000).toISOString().slice(0,10);
const tfL=s=>({900:'15m',3600:'1H',14400:'4H',28800:'8H',86400:'1D',604800:'1W',2592000:'1M'})[s]||s+'s';
const TFB=[['15m','15m'],['1h','1H'],['4h','4H'],['8h','8H'],['1d','1D'],['1w','1W'],['1M','1M']];
let tfSel=null;try{tfSel=localStorage.getItem('pvsra.tf')||null}catch(e){}
const NAMES={stocks:'Stock model',crypto:'Crypto model',trend:'Trend model',momentum:'Momentum model',combo:'Combined crypto',desk:'Desk portfolio'};

let S=null,view={kind:'model',market:'stocks'},chartData=null;
try{const v=JSON.parse(localStorage.getItem('pvsraBotView')||'null');if(v&&v.kind)view=v}catch(e){}
const saveView=()=>{try{localStorage.setItem('pvsraBotView',JSON.stringify(view))}catch(e){}};

/* ---------- data ---------- */
async function getJSON(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(r.status);return r.json()}
async function refresh(){
  try{S=await getJSON('/api/summary');$('upd').textContent='updated '+new Date().toLocaleTimeString()}catch(e){$('upd').textContent='dashboard server not reachable';return}
  try{BUB=await getJSON('/api/bubble/summary')}catch(e){BUB=null}
  renderTabs();
  if(view.kind==='bubble')return showBubble();
  const isM=view.kind==='model';$('modelMain').hidden=!isM;$('assetMain').hidden=isM;$('bubbleMain').hidden=true;$('side').hidden=false;
  if(isM)renderModel();else await loadAsset(!!chartData&&chartData.sym===view.sym&&chartData.market===view.market);
}
let BUB=null;const BTIER=['Normal','Elevated','Bubble zone'],BSTAGE=['No crash under way','Falling: wait','First third bought','Two thirds bought','Trend turned: fully bought'];
function showBubble(){$('modelMain').hidden=true;$('assetMain').hidden=true;$('status').hidden=true;$('side').hidden=true;$('bubbleMain').hidden=false;const f=$('bubbleFrame');if(!f.src)f.src='/bubble.html'}
// stock bot page: the Bubble Watch reading, for information (it does not change the bot's trades)
document.addEventListener('dash:rendered',e=>{if(e.detail.kind!=='model'||e.detail.market!=='stocks'||!BUB)return;const side=$('side');if(!side||$('bubBanner'))return;const col=BUB.tier===2?'var(--c-dn)':BUB.tier===1?'var(--accent)':'var(--muted)';
  side.insertAdjacentHTML('afterbegin',`<div id="bubBanner" class="sigcard" style="cursor:pointer;border-left:3px solid ${col}"><div class="top"><span class="side" style="color:${col}">BUBBLE WATCH · ${BTIER[BUB.tier].toUpperCase()} ${Math.floor(BUB.froth)}</span><span class="chip">open ›</span></div><div class="kv"><span>Momentum killers</span><span>${BUB.kill_n} of ${BUB.kill_avail}</span><span>Crash-buy score</span><span>${BUB.crash} · ${BSTAGE[BUB.stage]}</span></div><p class="rule">S&amp;P 500 reading for ${BUB.month}. For information: the stock bot's trades do not change with it.</p></div>`);
  $('bubBanner').onclick=()=>{view={kind:'bubble'};saveView();renderTabs();showBubble()}});
/* ---------- tabs ---------- */
function assetsOf(m){const b=S[m];if(!b||!b.state)return[];const st=b.state,last=st.lastBar||0,out=new Map();
  for(const s of Object.keys(st.positions||{}))out.set(s,{sym:s,market:m,open:true});
  for(const t of [...(st.trades||[])].reverse())if(!out.has(t.sym)&&last-t.t1<60*86400)out.set(t.sym,{sym:t.sym,market:m,open:false});
  if(m==='trend')for(const s of Object.keys(st.targets||{}))if(!out.has(s))out.set(s,{sym:s,market:m,open:false});return[...out.values()]}
function renderTabs(){
  const mk=(on,html,fn)=>{const b=document.createElement('button');b.setAttribute('role','tab');b.setAttribute('aria-pressed',String(on));b.innerHTML=html;b.onclick=fn;return b};
  $('models').replaceChildren(...['desk','stocks','crypto','trend','momentum','combo'].filter(m=>S[m]).map(m=>mk(view.kind==='model'&&view.market===m,`<span class="dot ${S[m].running?'open':''}"></span>${NAMES[m]}`,()=>{view={kind:'model',market:m};saveView();renderTabs();show()})));
  $('bubbleSeg').replaceChildren(mk(view.kind==='bubble',`<span class="dot" style="background:${BUB&&BUB.tier===2?'var(--c-dn)':BUB&&BUB.tier===1?'var(--accent)':'var(--muted)'}"></span>Bubble Watch${BUB?` <span class="tag">${Math.floor(BUB.froth)}</span>`:''}`,()=>{view={kind:'bubble'};saveView();renderTabs();showBubble()}));
  const list=[...assetsOf('stocks'),...assetsOf('crypto'),...(S.trend?assetsOf('trend'):[])];
  $('assets').hidden=!list.length;
  $('assets').replaceChildren(...list.map(a=>mk(view.kind==='asset'&&view.sym===a.sym&&view.market===a.market,`<span class="dot ${a.open?'open':''}" title="${a.open?'open position':'recently traded'}"></span>${a.sym.replace(/USDT$/,'')}<span class="tag">${a.market==='stocks'?'STK':a.market==='crypto'?'CRY':'TRD'}</span>`,()=>{view={kind:'asset',market:a.market,sym:a.sym};saveView();renderTabs();show()})));
}
function show(){if(view.kind==='bubble')return showBubble();const isM=view.kind==='model';$('modelMain').hidden=!isM;$('assetMain').hidden=isM;$('bubbleMain').hidden=true;$('side').hidden=false;if(isM)renderModel();else loadAsset(false)}

/* ---------- model tab ---------- */
let eqChart=null,eqSeries=null,eqBase=null;
function renderModel(){
  if(!S[view.market]){view={kind:'model',market:['crypto','stocks','trend'].find(m=>S[m])||'stocks'};saveView();renderTabs()}
  const b=S[view.market],side=$('side');
  if(!b.configured||!b.running){
    $('cards').innerHTML='';$('eqTtl').textContent='';if(eqChart){eqChart.remove();eqChart=null}
    if(view.market==='desk'){$('eq').innerHTML=`<div class="notice">The desk portfolio adds the bots together and re-splits the money between them on the first day of each quarter. Start the bots; this page fills in once each has finished a cycle.</div>`;side.innerHTML=deskSide(b);return}
    if(view.market==='combo'){$('eq').innerHTML=`<div class="notice">The combined crypto account adds the crypto bot and the trend bot together: a third of the money in the crypto bot, two thirds in the trend bot, rebalanced on the first day of each month. Start both bots; this page fills in after each has finished a cycle.</div>`;side.innerHTML=comboSide(b);return}
    $('eq').innerHTML=`<div class="notice">${!b.configured?`The ${NAMES[view.market].toLowerCase()} is not connected to this dashboard. Start the dashboard with <code>--${view.market} config.${view.market}.json</code>.`:(window.botApp?`The ${NAMES[view.market].toLowerCase()} has not finished a cycle yet. Press <b>Start</b> at the top right; this page fills in a minute or two after it starts (it checks the latest closed bar straight away, and in Paper mode replays recent history as a head start).`:`The ${NAMES[view.market].toLowerCase()} has not run yet. Start it with <code>npm start</code> using your ${view.market} config; this page fills in after its first cycle.`)}</div>`;
    side.innerHTML='<h2>Open positions</h2><div class="empty">None yet.</div>';document.dispatchEvent(new CustomEvent('dash:rendered',{detail:{kind:'model',market:view.market}}));return}
  const st=b.state,cfg=b.cfg,start=cfg.startCash||10000,eq=st.lastEquity,pos=Object.entries(st.positions||{}),SM_=()=>view.market==='stocks'?((st.meta&&st.meta.stockModel)||cfg.stockModel||'v3'):'v3';
  const total=eq/start-1,dStart=Math.floor((st.lastBar||0)/86400)*86400,prevPt=[...(b.equity||[])].reverse().find(x=>x[0]<dStart),dayChg=prevPt?eq/prevPt[1]-1:0,ddNow=st.peak?1-eq/st.peak:0;

    h+=`<div class="sigcard" style="border-color:color-mix(in srgb,var(--c-up) 55%,var(--line))"><div class="top"><span class="side" style="color:var(--c-up)">IN LONG</span><span class="chip">${r>=0?'+':''}${r.toFixed(2)}R open</span></div>
     <div class="kv"><span>Entered</span><span>${px(p.entry)} · ${ago} bars ago</span><span>Size</span><span>${money(p.notional)}</span><span>Now</span><span class="${pl>=0?'pos':'neg'}">${px(c)} · ${smoney(pl)}</span>
     <span>Stop</span><span style="color:var(--c-dn)">${px(p.stop)} (${pct(p.stop/c-1)})${p.stopWhy==='profit stop'?' · profit stop':''}</span><span>Target</span><span style="color:var(--c-up)">${px(p.entry+2*risk)} (+2R${c>=p.entry+2*risk?', reached':''})</span><span>Exit when</span><span>consensus below +${R.exit} (now ${v>0?'+':''}${v})</span></div></div>`}
  else h+=`<div class="sigcard"><div class="top"><span class="side" style="color:var(--muted)">FLAT · ${v>=R.entry?'IN BUY ZONE':'WAITING'}</span><span class="chip">consensus ${v>0?'+':''}${v}</span></div>
     <div class="kv"><span>Enter long</span><span>when consensus reaches +${R.entry}</span><span>If long now</span><span><span style="color:var(--c-dn)">stop ${px(c-R.stopK*d.atr[n-1])}</span> · <span style="color:var(--c-up)">target ${px(c+2*R.stopK*d.atr[n-1])}</span></span></div>

  {const sg=(d.signals||[]).filter(t=>t.why!=='open'&&t.t0>=d.bars[0].time),w=sg.filter(t=>t.pct>0).length,avg=sg.length?sg.reduce((a,t)=>a+t.pct,0)/sg.length:0,sum=sg.reduce((a,t)=>a*(1+t.pct/100),1)-1;

  $('side').innerHTML=h;const tg=$('sigTg');if(tg)tg.onclick=()=>{showSig=!showSig;try{localStorage.setItem('pvsra.sig',showSig?'1':'0')}catch(e){}loadAsset(true)}}
function trendAssetSide(){const d=chartData,A=d.now,p=d.position,c=d.bars[d.bars.length-1].close,sh=v=>Math.round((v||0)*100)+'%',nm=d.sym.replace(/USDT$/,'');
  let h='';
  if(A){const k=A.votes.filter(v=>v.yes).length;
    h+=`<h2>Trend votes</h2><div class="cons"><span class="score" style="color:${k>=4?C['--accent']:C['--muted']}">${k}/8</span><span class="lab" style="color:${k>=4?C['--accent']:C['--muted']}">${k>=6?'Strong uptrend':k>=4?'Uptrend':k>=2?'Weak':'Downtrend'}</span><div class="gauge"><i style="left:calc(${k/8*100}% - 2px)"></i></div></div>
      <div class="kv">${A.votes.map(v=>`<span>${v.q.replace(/^./,x=>x.toUpperCase())}</span><span style="color:${v.yes?C['--c-up']:C['--muted']}">${v.yes?'yes':'no'} · ${px(v.v)}</span>`).join('')}</div>
      <h2>Size</h2><div class="kv"><span>Volatility</span><span>${Math.round(A.vol*100)}% a year</span><span>Size factor</span><span>${A.scale<0.999?sh(A.scale)+' (aims for 80% a year)':'full (below 80% a year)'}</span>${nm!=='BTC'?`<span>Bitcoin trend</span><span style="color:${d.gated?C['--c-dn']:C['--c-up']}">${d.gated?'down · altcoins paused':'up'}</span>`:''}<span>Model share</span><span><b>${d.gated?'0%':sh(A.exposure)}</b>${d.N>1?' of its slot (a tenth of the money)':' of the account'}</span></div>`}
  h+='<h2>Position</h2>'+(p?`<div class="sigcard" style="border-color:color-mix(in srgb,var(--accent) 55%,var(--line))"><div class="top"><span class="side" style="color:var(--accent)">HOLDING ${sh(p.weight)}</span><span class="chip">target ${sh(p.target)}</span></div>
     <div class="kv"><span>Coins</span><span>${px(p.qty)} ${nm}</span><span>Value</span><span>${money(p.qty*c)}</span><span>Average cost</span><span>${px(p.entry)} (${pct(c/p.entry-1)})</span><span>Open profit</span><span class="${p.qty*c-p.cost>=0?'pos':'neg'}">${smoney(p.qty*c-p.cost)}</span><span>Since</span><span>${day(p.t0)}</span></div>
     <p class="rule">No stop-loss: the model lowers its share as the trend weakens and sells everything when all eight votes say no.</p></div>`:`<div class="sigcard"><div class="top"><span class="side" style="color:var(--muted)">IN CASH</span></div><p class="rule">Buys when at least one trend vote says yes${nm!=='BTC'?' and Bitcoin itself is trending up':''}; the more votes, the bigger the share.</p></div>`);
  const od=[...d.orders].reverse();
  h+=`<h2>Orders on ${nm}</h2>`+(od.length?od.slice(0,20).map(o=>`<div class="tl"><span><span class="m">${day(o.t)}</span> <b style="color:${o.side==='BUY'?'var(--c-up)':'var(--fg)'}">${o.side}</b>${o.hist?' <span class="hist">history</span>':''}</span><span>${money(o.value)}</span><span class="w">${sh(o.from)} → ${sh(o.to)} of the account @ ${px(o.price)}</span></div>`).join(''):'<div class="empty">No orders on this coin yet.</div>');
  const tr=[...d.trades].reverse(),tot=tr.reduce((a,t)=>a+t.pnl,0);
  if(tr.length)h+=`<h2>Closed holdings</h2>`+tr.map(t=>`<div class="tl"><span>${day(t.t0)} → ${day(t.t1)}${t.hist?' <span class="hist">history</span>':''}</span><span class="${t.pnl>=0?'pos':'neg'}">${smoney(t.pnl)}</span><span class="w">avg cost ${px(t.entry)} → sold ${px(t.exit)}</span></div>`).join('')+`<div class="tl"><span class="m">total</span><span class="${tot>=0?'pos':'neg'}"><b>${smoney(tot)}</b></span></div>`;
  $('side').innerHTML=h}
function drawRibbon(){if(!ch||!chartData)return;const el=$('chart'),dpr=window.devicePixelRatio||1,w=el.clientWidth,hh=el.clientHeight;back.width=w*dpr;back.height=hh*dpr;back.style.width=w+'px';back.style.height=hh+'px';ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,hh);
  const ts=ch.timeScale(),r=ts.getVisibleLogicalRange();if(!r)return;const bars=chartData.bars,s=chartData.s,ph=hh-ts.height(),pw=w-ch.priceScale('right').width(),RH=14,y=ph-RH-3;
  const bs=Math.max(1,(ts.logicalToCoordinate(1)??0)-(ts.logicalToCoordinate(0)??0));
  ctx.save();ctx.beginPath();ctx.rect(0,0,pw,ph);ctx.clip();ctx.fillStyle=alpha(C['--bg'],.85);ctx.fillRect(0,y-3,pw,RH+6);
  const TR=chartData.kind==='trend',fillFor=v=>TR?(v<=0?alpha(C['--muted'],.25):alpha(C['--accent'],.25+.75*v/100)):(Math.abs(v)<10?alpha(C['--muted'],.3):consCol(v));
  for(let i=Math.max(0,Math.floor(r.from)-1);i<=Math.min(bars.length-1,Math.ceil(r.to)+1);i++){const x=ts.logicalToCoordinate(i);if(x==null)continue;const v=s[i];ctx.fillStyle=fillFor(v);ctx.fillRect(x-bs/2,y,Math.max(1,bs+.5),RH)}
  ctx.font='600 10px "IBM Plex Mono", monospace';const lab=TR?'MODEL SHARE':'CONSENSUS',lw=ctx.measureText(lab).width+10;ctx.fillStyle=alpha(C['--bg'],.9);ctx.fillRect(4,y+1,lw,RH-2);ctx.fillStyle=C['--fg'];ctx.fillText(lab,9,y+RH-4);
  const xl=ts.logicalToCoordinate(bars.length-1);if(TR&&xl!=null&&xl<pw){const v=s[bars.length-1],t=v+'% held',tw=ctx.measureText(t).width+10,xx=Math.min(pw-tw-2,xl+bs);ctx.fillStyle=v>0?C['--accent']:C['--muted'];ctx.fillRect(xx,y,tw,RH);ctx.fillStyle=v>0?(C['--accent-ink']||'#0b0e12'):'#0b0e12';ctx.fillText(t,xx+5,y+RH-4)}
  else if(xl!=null&&xl<pw){const v=s[bars.length-1],t=(v>0?'+':'')+v+' '+consLabel(v),tw=ctx.measureText(t).width+10,xx=Math.min(pw-tw-2,xl+bs);const tk=consTok(v);ctx.fillStyle=Math.abs(v)<10?C['--muted']:consCol(v);ctx.fillRect(xx,y,tw,RH);ctx.fillStyle=(tk==='--n-dn'||tk==='--r-up'||tk==='--c-dn'||tk==='--r-dn')?'#ffffff':'#0b0e12';ctx.fillText(t,xx+5,y+RH-4)}
  ctx.restore()}
